<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnduranceTestGUI Manual / マニュアル</title>
<script>
  // Redirect to the manual matching the browser's language, falling back to
  // English for anything that isn't Japanese. If JavaScript is disabled,
  // the plain-HTML body below still offers both links directly.
  (function () {
    var lang = (navigator.language || navigator.userLanguage || "en").toLowerCase();
    var target = lang.indexOf("ja") === 0 ? "ja/" : "en/";
    location.replace(target);
  })();
</script>
<style>
  :root {
    --bg: #f5f6f8;
    --panel-bg: #ffffff;
    --text: #1c1f26;
    --text-muted: #5b6270;
    --border: #e1e4ea;
    --accent: #3a63f0;
    --accent-bg: #eef2ff;
    --shadow: 0 1px 3px rgba(20, 24, 34, 0.08), 0 1px 2px rgba(20, 24, 34, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --panel-bg: #1e2128;
      --text: #e7e9ee;
      --text-muted: #9aa1b0;
      --border: #2d313b;
      --accent: #7c9bff;
      --accent-bg: #232a44;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  main {
    max-width: 420px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    box-shadow: var(--shadow);
  }
  h1 { margin: 0 0 8px; font-size: 1.4rem; }
  p { color: var(--text-muted); margin: 0 0 20px; line-height: 1.6; }
  .links { display: flex; gap: 12px; justify-content: center; }
  a.lang {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 999px;
    background: var(--accent-bg);
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    border: 1px solid var(--accent);
  }
  a.lang:hover { opacity: 0.85; }
</style>
</head>
<body>
  <main>
    <h1>EnduranceTestGUI</h1>
    <p>
      Redirecting to the manual for your browser's language&hellip;<br>
      お使いのブラウザの言語設定に応じてマニュアルへ移動しています…
    </p>
    <noscript><p>JavaScript is disabled — please choose a language below. / JavaScriptが無効です。下から言語を選んでください。</p></noscript>
    <div class="links">
      <a class="lang" href="ja/">日本語</a>
      <a class="lang" href="en/">English</a>
    </div>
  </main>
</body>
</html>
